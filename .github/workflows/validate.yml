name: Validate training application
on:
  pull_request:
  push:
    branches: ["feat/**"]
permissions:
  contents: read
jobs:
  validate:
    # Playwright 1.58.2 supports Ubuntu 24.04; keep its browser dependencies stable.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Browser validation (no deployment)
        run: |
          python3 -m http.server 8000 --bind 0.0.0.0 > /tmp/ffw-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/ >/dev/null && break || sleep 1; done
          CHROMIUM_PATH="$(node --input-type=module -e "import {chromium} from 'playwright'; console.log(chromium.executablePath())")" npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-ui-screenshots
          path: docs/screenshots/
